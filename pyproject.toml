[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kalshi-bot"
version = "0.1.0"
description = "Maker-only trading bot for Kalshi 15-minute crypto markets, with dry-run mode and a P&L dashboard"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31",
    "cryptography>=42",
    "PyYAML>=6",
    "tzdata>=2024.1; platform_system == 'Windows'",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
kalshi-bot = "kalshi_bot.__main__:main"

[tool.setuptools.packages.find]
include = ["kalshi_bot*"]

[tool.setuptools.package-data]
"kalshi_bot.dashboard" = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
