name: asset-discovery

# Read-only research: lists real CC0 candidates (metadata only) for the asset BOM.
on:
  workflow_dispatch:
  push:
    paths:
      - 'Tools/Assets/discover_cc0.py'
      - '.github/workflows/asset-discovery.yml'

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Query Poly Haven and ambientCG APIs
        run: python3 Tools/Assets/discover_cc0.py --out cc0-candidates.json --limit 8
      - uses: actions/upload-artifact@v4
        with:
          name: cc0-candidates
          path: cc0-candidates.json
