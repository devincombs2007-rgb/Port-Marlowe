# Port Marlowe CI.
#
# Environments are deliberately separate:
#   * Linux (ubuntu-latest): engine-independent core tests, Unity API compile check (no licence:
#     the editor never runs), and - only when Unity licence secrets exist - Unity EditMode/PlayMode
#     tests and a Linux development player build with an automated gameplay smoke run.
#   * Windows (windows-latest): UWP export + MSBuild packaging for Xbox Dev Mode sideloading.
#     Runs only when licence secrets exist. A package is reported as built only if this job
#     produces one; nothing here claims Xbox execution.
#
# Licence secrets (repository Settings > Secrets and variables > Actions), as documented by GameCI:
#   UNITY_EMAIL, UNITY_PASSWORD, and either UNITY_LICENSE (Personal, contents of Unity_lic.ulf)
#   or UNITY_SERIAL (Plus/Pro). Values are never printed.
name: ci

on:
  push:
    branches: ['**']
    paths-ignore: ['Docs/**', '**/*.md']
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  UNITY_VERSION: 6000.6.8f1
  UNITY_REVISION: 237b6593792b

jobs:
  core-tests:
    name: Core simulation tests (dotnet)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Build core as .NET Standard 2.1 / C# 9 (Unity profile)
        run: dotnet build Tools/CoreTests/Core/PortMarlowe.Core.csproj -warnaserror
      - name: Run NUnit tests
        run: dotnet test Tools/CoreTests/Tests/PortMarlowe.CoreTests.csproj --logger "trx;LogFileName=core.trx" --results-directory TestResults
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: core-test-results
          path: TestResults

  license-probe:
    name: Unity licence availability
    runs-on: ubuntu-latest
    outputs:
      available: ${{ steps.probe.outputs.available }}
    steps:
      - id: probe
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
        run: |
          set_or_not() { if [ -n "$1" ]; then echo set; else echo missing; fi; }
          echo "UNITY_EMAIL:    $(set_or_not "$UNITY_EMAIL")"
          echo "UNITY_PASSWORD: $(set_or_not "$UNITY_PASSWORD")"
          echo "UNITY_LICENSE:  $(set_or_not "$UNITY_LICENSE")"
          echo "UNITY_SERIAL:   $(set_or_not "$UNITY_SERIAL")"
          if [ -n "$UNITY_LICENSE" ]; then
            # Shape check only; nothing from the secret is printed.
            if printf '%s' "$UNITY_LICENSE" | grep -q '<DeveloperData Value="'; then
              echo "UNITY_LICENSE format: looks like a Unity licence file (.ulf)"
            else
              echo "::warning ::UNITY_LICENSE is set but does not look like the contents of Unity_lic.ulf (no DeveloperData field). Paste the whole file."
            fi
          fi
          if [ -n "$UNITY_EMAIL" ] && [ -n "$UNITY_PASSWORD" ] && { [ -n "$UNITY_LICENSE" ] || [ -n "$UNITY_SERIAL" ]; }; then
            echo "available=true" >> "$GITHUB_OUTPUT"
            echo "Unity licence secrets present: licensed jobs will run."
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Unity licence not configured::Editor-run jobs (tests, player build, UWP package) are skipped. Add UNITY_EMAIL, UNITY_PASSWORD and UNITY_LICENSE or UNITY_SERIAL secrets."
          fi

  unity-compile-check:
    name: Unity API compile check (no editor run)
    runs-on: ubuntu-latest
    env:
      IMAGE: unityci/editor:ubuntu-6000.6.8f1-base-3
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - name: Restore extracted editor assemblies (workflow-private cache, never published)
        id: editor-cache
        uses: actions/cache/restore@v6
        with:
          path: editor
          key: unity-editor-managed-${{ env.UNITY_VERSION }}-v1
      - name: Extract managed assemblies and packages from the editor image
        if: steps.editor-cache.outputs.cache-hit != 'true'
        run: |
          docker pull -q "$IMAGE"
          docker create --name unity-editor "$IMAGE" >/dev/null
          mkdir -p editor/Data/Resources editor/Data/Tools
          docker cp unity-editor:/opt/unity/Editor/Data/Managed editor/Data/Managed
          docker cp unity-editor:/opt/unity/Editor/Data/NetStandard editor/Data/NetStandard
          docker cp unity-editor:/opt/unity/Editor/Data/Resources/PackageManager editor/Data/Resources/PackageManager
          docker rm unity-editor >/dev/null
          # Keep only what compilation needs (drop pdb/xml docs) to keep the cache small.
          find editor -name "*.pdb" -delete
          find editor/Data/Managed -name "*.xml" -delete
          du -sh editor
      - name: Save extracted editor assemblies (saved even if the compile step later fails)
        if: steps.editor-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: editor
          key: unity-editor-managed-${{ env.UNITY_VERSION }}-v1
      - name: Compile project assemblies against Unity managed assemblies
        run: python3 Tools/UnityCompileCheck/compile_check.py --data editor/Data --project . --work compile-work --unity-version "$UNITY_VERSION"

  unity-tests:
    name: Unity EditMode + PlayMode tests (licensed)
    needs: [license-probe]
    if: needs.license-probe.outputs.available == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write   # the test runner posts a "Test Results" check
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true
      - name: Fetch CC0 surface sets (pinned; procedural fallback if unavailable)
        continue-on-error: true
        run: |
          python3 -m pip install --quiet pillow
          python3 Tools/Assets/fetch_cc0.py
      - uses: actions/cache@v6
        with:
          path: Library
          key: Library-linux-${{ hashFiles('Packages/manifest.json', 'ProjectSettings/ProjectVersion.txt') }}
      - uses: game-ci/unity-test-runner@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
        with:
          unityVersion: ${{ env.UNITY_VERSION }}
          testMode: all
          artifactsPath: test-results
          checkName: Unity test results
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: unity-test-results
          path: test-results

  linux-player:
    name: Linux development player + automated smoke run (licensed)
    needs: [license-probe]
    if: needs.license-probe.outputs.available == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true
      - name: Fetch CC0 surface sets (pinned; procedural fallback if unavailable)
        continue-on-error: true
        run: |
          python3 -m pip install --quiet pillow
          python3 Tools/Assets/fetch_cc0.py
      - uses: actions/cache@v6
        with:
          path: Library
          key: Library-linux-build-${{ hashFiles('Packages/manifest.json', 'ProjectSettings/ProjectVersion.txt') }}
      - uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
        with:
          unityVersion: ${{ env.UNITY_VERSION }}
          targetPlatform: StandaloneLinux64
          buildMethod: PortMarlowe.EditorTools.BuildTool.BuildFromCommandLine
          customParameters: -pmProfile LinuxDev
          buildsPath: Builds
          versioning: None   # shallow checkout: no git history for semantic versioning
      - name: Headless gameplay smoke run - no GPU, logic only, graphics unverified
        run: |
          exe=$(find Builds -maxdepth 4 -type f -name 'PortMarlowe.x86_64' | head -1)
          if [ -z "$exe" ]; then echo "::error ::Linux player not found under Builds/"; find Builds -maxdepth 4 | head -40; exit 1; fi
          echo "player: $exe"
          # The build was written by root inside the GameCI container.
          sudo chown -R "$(id -u):$(id -g)" Builds
          chmod +x "$exe"
          timeout 600 "$exe" -batchmode -nographics -logFile player.log -pmAutotest "$PWD/autotest.json" || code=$?
          cat autotest.json 2>/dev/null || echo "no autotest report"
          tail -n 80 player.log
          exit ${code:-0}
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: linux-player-smoke
          path: |
            autotest.json
            player.log

  web-build:
    name: Unity Web (browser) build, published to GitHub Pages (licensed)
    needs: [license-probe]
    if: needs.license-probe.outputs.available == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write   # publishes the build to the gh-pages branch
    steps:
      - uses: actions/checkout@v7
      - name: Fetch CC0 surface sets (pinned; procedural fallback if unavailable)
        continue-on-error: true
        run: |
          python3 -m pip install --quiet pillow
          python3 Tools/Assets/fetch_cc0.py
      - uses: actions/cache@v6
        with:
          path: Library
          key: Library-web-${{ hashFiles('Packages/manifest.json', 'ProjectSettings/ProjectVersion.txt') }}
      - uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
        with:
          unityVersion: ${{ env.UNITY_VERSION }}
          targetPlatform: WebGL
          buildMethod: PortMarlowe.EditorTools.BuildTool.BuildFromCommandLine
          customParameters: -pmProfile Web
          buildsPath: Builds
          versioning: None
      - name: Locate the Web build
        id: site
        run: |
          sudo chown -R "$(id -u):$(id -g)" Builds
          index=$(find Builds -maxdepth 4 -name index.html | head -1)
          if [ -z "$index" ]; then echo "::error ::index.html not found under Builds/"; find Builds -maxdepth 4 | head -40; exit 1; fi
          site=$(dirname "$index")
          touch "$site/.nojekyll"
          du -sh "$site"; find "$site" -type f -size +90M -exec echo "::error ::file over GitHub Pages' 100 MB limit: {}" \;
          echo "dir=$site" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v7
        with:
          name: web-build
          path: ${{ steps.site.outputs.dir }}
      - name: Publish to the gh-pages branch (single commit, replaces the previous build)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd "${{ steps.site.outputs.dir }}"
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Port Marlowe Web build from ${GITHUB_SHA::7}"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
          echo "Published. Once GitHub Pages serves the gh-pages branch, play at: https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}/" >> "$GITHUB_STEP_SUMMARY"

  uwp-package:
    name: Windows UWP export + MSBuild package (licensed)
    needs: [license-probe]
    if: needs.license-probe.outputs.available == 'true'
    runs-on: windows-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true
      - name: Fetch CC0 surface sets (pinned; procedural fallback if unavailable)
        continue-on-error: true
        shell: pwsh
        run: |
          python -m pip install --quiet pillow
          python Tools/Assets/fetch_cc0.py
      - name: Install Unity editor + UWP module (official silent installers, URLs from Unity's release API)
        shell: pwsh
        run: |
          $rel = (Invoke-RestMethod "https://services.api.unity.com/unity/editor/release/v1/releases?version=$env:UNITY_VERSION").results[0]
          if (-not $rel) { Write-Error "Unity $env:UNITY_VERSION not found in the release API"; exit 1 }
          $win = $rel.downloads | Where-Object { $_.platform -eq 'WINDOWS' -and $_.architecture -eq 'X86_64' } | Select-Object -First 1
          $uwp = $win.modules | Where-Object { $_.id -eq 'universal-windows-platform' } | Select-Object -First 1
          if (-not $win.url -or -not $uwp.url) { Write-Error "Editor or UWP module download not listed for $env:UNITY_VERSION"; exit 1 }
          "Editor: $($win.url)"; "UWP module: $($uwp.url)"
          Invoke-WebRequest $win.url -OutFile editor.exe
          Invoke-WebRequest $uwp.url -OutFile uwp.exe
          Start-Process .\editor.exe -ArgumentList '/S','/D=C:\Unity' -Wait
          Start-Process .\uwp.exe -ArgumentList '/S','/D=C:\Unity' -Wait
          if (-not (Test-Path C:\Unity\Editor\Unity.exe)) { Write-Error "Unity.exe missing after install"; exit 1 }
          Get-ChildItem C:\Unity\Editor\Data\PlaybackEngines | Select-Object -ExpandProperty Name
      - name: Activate licence (online, serial from Personal .ulf or Plus/Pro serial)
        shell: pwsh
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
        run: |
          # A Unity_lic.ulf made by Unity Hub is bound to the machine that created it, so it is not
          # copied onto the runner. Like GameCI, read the serial embedded in it (DeveloperData,
          # base64, first 4 bytes are padding) and activate this machine online with it.
          $serial = $env:UNITY_SERIAL
          if (-not $serial) {
            $m = [regex]::Match($env:UNITY_LICENSE, '<DeveloperData Value="([^"]+)"')
            if (-not $m.Success) { Write-Error "UNITY_LICENSE is not a Unity licence file (no DeveloperData field)."; exit 1 }
            $raw = [System.Text.Encoding]::GetEncoding(28591).GetString([Convert]::FromBase64String($m.Groups[1].Value))
            $serial = $raw.Substring(4)
          }
          Write-Output "::add-mask::$serial"
          $uargs = @('-batchmode','-quit','-nographics','-logFile','activate.log','-serial',$serial,'-username',$env:UNITY_EMAIL,'-password',$env:UNITY_PASSWORD)
          for ($i = 1; $i -le 3; $i++) {
            $p = Start-Process -FilePath C:\Unity\Editor\Unity.exe -ArgumentList $uargs -Wait -PassThru -NoNewWindow
            if ($p.ExitCode -eq 0) { "Activation succeeded (attempt $i)."; break }
            "Activation attempt $i failed with exit code $($p.ExitCode)."
            if (Test-Path activate.log) { Get-Content activate.log -Tail 25 }
            if ($i -eq 3) { Write-Error "Unity licence activation failed. Check the secrets, and that the Unity account does not require two-factor sign-in."; exit 1 }
            Start-Sleep -Seconds (15 * $i)
          }
      - name: Export UWP Visual Studio solution
        shell: pwsh
        run: |
          & C:\Unity\Editor\Unity.exe -batchmode -quit -nographics -projectPath . -buildTarget WSAPlayer -logFile uwp-export.log -executeMethod PortMarlowe.EditorTools.BuildTool.BuildFromCommandLine -pmProfile UwpDiagnostic | Out-Null
          $code = $LASTEXITCODE
          Get-Content uwp-export.log -Tail 120
          if ($code -ne 0) { exit $code }
      - name: Create test signing certificate (CI only; never committed)
        shell: pwsh
        run: |
          $cert = New-SelfSignedCertificate -Type Custom -Subject "CN=PortMarloweDev" -KeyUsage DigitalSignature -FriendlyName "Port Marlowe CI test" -CertStoreLocation "Cert:\CurrentUser\My" -TextExtension @("2.5.29.37={text}1.3.6.1.5.5.7.3.3", "2.5.29.19={text}")
          $pwd = ConvertTo-SecureString -String "ci-only" -Force -AsPlainText
          Export-PfxCertificate -Cert $cert -FilePath "$env:RUNNER_TEMP\pm_ci.pfx" -Password $pwd | Out-Null
          Export-Certificate -Cert $cert -FilePath "PortMarlowe_CI_TestCert.cer" | Out-Null
          "THUMB=$($cert.Thumbprint)" >> $env:GITHUB_ENV
      - name: MSBuild x64 package (Master)
        shell: pwsh
        run: |
          $msbuild = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -requires Microsoft.Component.MSBuild -find MSBuild\**\Bin\MSBuild.exe | Select-Object -First 1
          $sln = Get-ChildItem Builds\UWP -Filter *.sln -Recurse | Select-Object -First 1
          & $msbuild $sln.FullName /m /p:Configuration=Master /p:Platform=x64 /p:AppxBundle=Never /p:UapAppxPackageBuildMode=SideloadOnly /p:AppxPackageSigningEnabled=true /p:PackageCertificateKeyFile="$env:RUNNER_TEMP\pm_ci.pfx" /p:PackageCertificatePassword=ci-only /p:AppxPackageDir="$PWD\Delivery\" /v:minimal
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-ChildItem Delivery -Recurse | Select-Object FullName, Length
      - name: Return licence seat
        if: always()
        shell: pwsh
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: |
          if (Test-Path C:\Unity\Editor\Unity.exe) {
            $p = Start-Process -FilePath C:\Unity\Editor\Unity.exe -ArgumentList @('-batchmode','-quit','-nographics','-returnlicense','-username',$env:UNITY_EMAIL,'-password',$env:UNITY_PASSWORD,'-logFile','return.log') -Wait -PassThru -NoNewWindow
            "Return licence exit code: $($p.ExitCode)"
          }
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: uwp-package
          path: |
            Delivery
            PortMarlowe_CI_TestCert.cer
            uwp-export.log
