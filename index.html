<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Improve forever. Your training, nutrition, focus, sleep, habits and goals in one place.">
<title>IMP4EVR</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="IMP4EVR">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@200;300;400;500;600;700&family=Geist+Mono:wght@400;500&display=swap">
<style>
/* Layout: one phone-width column (Apple grouped lists) on a black OLED ground (Tesla), frosted tab bar that turns into a left rail on wide screens. */
:root {
  --bg: #000000;
  --bg2: #0b0b0d;
  --card: #141416;
  --card2: #1f1f22; --chip: #232327;
  --card3: #2a2a2e;
  --line: rgba(255, 255, 255, 0.08);
  --line2: rgba(255, 255, 255, 0.14);
  --fg: #f5f5f7;
  --fg2: #a1a1a6;
  --fg3: #96969f;
  --bar: rgba(12, 12, 14, 0.72);
  --scrim: rgba(0, 0, 0, 0.6);
  --red: #e82127;
  --red-soft: rgba(232, 33, 39, 0.16);
  --body: #ff375f;
  --fuel: #30d158;
  --mind: #40c8ff;
  --sleep: #7d7aff;
  --gold: #ffd60a;
  --good: #30d158;
  --warn: #ff9f0a;
  --crit: #ff453a;
  --on-fg: #000000;
  --shadow: 0 18px 50px rgba(0, 0, 0, 0.55);
  --font-text: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Geist", system-ui, "Segoe UI", Roboto, sans-serif;
  --font-display: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Geist", system-ui, "Segoe UI", Roboto, sans-serif;
  --font-mono: ui-monospace, "SF Mono", "Geist Mono", Menlo, Consolas, monospace;
  --r-lg: 22px;
  --r-md: 16px;
  --r-sm: 12px;
  --tab-h: 62px;
  --rail: 92px;
  color-scheme: dark;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --bg: #f2f2f7; --bg2: #ebebf0; --card: #ffffff; --card2: #f2f2f6; --card3: #e5e5ea; --chip: #e4e4ea;
    --line: rgba(0, 0, 0, 0.08); --line2: rgba(0, 0, 0, 0.14);
    --fg: #1d1d1f; --fg2: #6e6e73; --fg3: #6b6b73;
    --bar: rgba(249, 249, 251, 0.78); --scrim: rgba(0, 0, 0, 0.32);
    --red: #d6181e; --red-soft: rgba(214, 24, 30, 0.1);
    --body: #e8164c; --fuel: #1f9d45; --mind: #0077d9; --sleep: #5856d6; --gold: #c99400;
    --good: #1f9d45; --warn: #c76a00; --crit: #d70015; --on-fg: #ffffff;
    --shadow: 0 18px 50px rgba(0, 0, 0, 0.14);
    color-scheme: light;
  }
}
:root[data-theme="light"] {
  --bg: #f2f2f7; --bg2: #ebebf0; --card: #ffffff; --card2: #f2f2f6; --card3: #e5e5ea; --chip: #e4e4ea;
  --line: rgba(0, 0, 0, 0.08); --line2: rgba(0, 0, 0, 0.14);
  --fg: #1d1d1f; --fg2: #6e6e73; --fg3: #6b6b73;
  --bar: rgba(249, 249, 251, 0.78); --scrim: rgba(0, 0, 0, 0.32);
  --red: #d6181e; --red-soft: rgba(214, 24, 30, 0.1);
  --body: #e8164c; --fuel: #1f9d45; --mind: #0077d9; --sleep: #5856d6; --gold: #c99400;
  --good: #1f9d45; --warn: #c76a00; --crit: #d70015; --on-fg: #ffffff;
  --shadow: 0 18px 50px rgba(0, 0, 0, 0.14);
  color-scheme: light;
}
:root[data-theme="dark"] { color-scheme: dark; }

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
[hidden] { display: none !important; }
html, body { min-height: 100%; }
html { scroll-padding-top: env(safe-area-inset-top, 0px); scrollbar-gutter: stable; }
img { max-width: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--fg);
  font: 400 16px/1.42 var(--font-text);
  -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility;
  overscroll-behavior-y: none;
}
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; border: 0; background: none; padding: 0; }
input, select, textarea {
  background: var(--card2); border: 1px solid transparent; border-radius: var(--r-sm);
  padding: 12px 14px; width: 100%; outline: none; min-width: 0;
}
input:focus, select:focus, textarea:focus { border-color: var(--line2); background: var(--card3); }
textarea { resize: vertical; min-height: 110px; line-height: 1.5; }
input[type="time"], input[type="date"] { min-height: 46px; }
:focus-visible { outline: 2px solid var(--mind); outline-offset: 2px; }
.ic { flex: none; display: block; }
.tn, .num { font-variant-numeric: tabular-nums; }

/* ---------- Shell ---------- */
#main {
  max-width: 580px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 12px calc(var(--tab-h) + 40px + env(safe-area-inset-bottom, 0px));
}
.tabbar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 30;
  display: flex; justify-content: center;
  padding-bottom: env(safe-area-inset-bottom, 0px);
  padding-left: max(8px, env(safe-area-inset-left, 0px));
  padding-right: max(8px, env(safe-area-inset-right, 0px));
  background: var(--bar);
  -webkit-backdrop-filter: saturate(180%) blur(22px); backdrop-filter: saturate(180%) blur(22px);
  border-top: 1px solid var(--line);
}
.tabbar button {
  flex: 1; max-width: 108px; height: var(--tab-h);
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;
  color: var(--fg3); font-size: 10.5px; font-weight: 600; letter-spacing: 0.01em;
}
.tabbar button[aria-current="page"] { color: var(--fg); }
.tabbar button[aria-current="page"] .ic { color: var(--red); }
@media (min-width: 900px) {
  .tabbar {
    top: 0; right: auto; width: var(--rail); flex-direction: column; justify-content: center; gap: 6px;
    border-top: 0; border-right: 1px solid var(--line);
    padding: env(safe-area-inset-top, 0px) 0 env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px);
  }
  .tabbar button { flex: none; height: 68px; max-width: none; }
  #main { padding-bottom: 60px; }
  .tabbar .brand-dot { display: block; }
}
.brand-dot { display: none; width: 10px; height: 10px; border-radius: 3px; background: var(--red); margin: 0 auto 18px; }

/* ---------- Type ---------- */
.eyebrow { font-size: 12px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--fg3); }
.lt { font: 700 34px/1.08 var(--font-display); letter-spacing: -0.026em; margin: 2px 0 0; text-wrap: balance; }
.h2 { font: 600 21px/1.2 var(--font-display); letter-spacing: -0.018em; margin: 0; text-wrap: balance; }
.h3 { font-size: 17px; font-weight: 600; letter-spacing: -0.01em; margin: 0; }
.sub { font-size: 13.5px; color: var(--fg2); }
.tiny { font-size: 12px; color: var(--fg3); }
.cap { font-size: 11.5px; font-weight: 600; letter-spacing: 0.09em; text-transform: uppercase; color: var(--fg3); }
.num-xl { font: 200 92px/0.9 var(--font-display); letter-spacing: -0.045em; font-variant-numeric: tabular-nums; }
.num-l { font: 300 46px/1 var(--font-display); letter-spacing: -0.035em; font-variant-numeric: tabular-nums; }
.num-m { font: 500 26px/1.05 var(--font-display); letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
.num-s { font: 600 17px/1.1 var(--font-display); font-variant-numeric: tabular-nums; }
.mono { font-family: var(--font-mono); }
.muted { color: var(--fg2); }
.red { color: var(--red); }

/* ---------- Page header ---------- */
.ph { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; padding: 14px 2px 18px; }
.ph-actions { display: flex; gap: 8px; align-items: center; padding-bottom: 4px; }
.icon-btn {
  width: 44px; height: 44px; flex-shrink: 0; border-radius: 50%; display: grid; place-items: center;
  background: var(--card); color: var(--fg);
}
.icon-btn.accent { background: var(--red); color: #fff; }
.icon-btn:active { transform: scale(0.94); }
.sync { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--fg3); }
.sync i { width: 7px; height: 7px; border-radius: 50%; background: var(--fg3); }
.sync[data-s="synced"] i { background: var(--good); }
.sync[data-s="connecting"] i { background: var(--warn); }
.sync[data-s="offline"] i { background: var(--crit); }

/* ---------- Blocks ---------- */
.stack { display: flex; flex-direction: column; gap: 14px; }
.card { background: var(--card); border-radius: var(--r-lg); padding: 18px; min-width: 0; }
.card.flush { padding: 6px 0; }
.card.tight { padding: 14px; }
.sec { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; padding: 14px 4px 2px; }
.link, .sec .link { font-size: 14px; color: var(--red); font-weight: 600; }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.row3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.between { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.hgap { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.grow { flex: 1; min-width: 0; }
.divider { height: 1px; background: var(--line); margin: 14px 0; }
.empty { padding: 22px 18px; text-align: center; color: var(--fg2); font-size: 14px; }
.empty .h3 { color: var(--fg); margin-bottom: 4px; }

/* Lists */
.list { display: flex; flex-direction: column; }
.li {
  display: flex; align-items: center; gap: 12px; min-height: 54px;
  padding: 10px 18px; position: relative; width: 100%; text-align: left;
}
.li + .li::before { content: ""; position: absolute; top: 0; left: 58px; right: 0; height: 1px; background: var(--line); }
.li.noicon + .li.noicon::before { left: 18px; }
.li .t { font-size: 16px; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.li .s { display: block; font-size: 13px; color: var(--fg2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.li .grow { overflow: hidden; }
.li .end { color: var(--fg3); font-size: 14px; display: flex; align-items: center; gap: 6px; flex: none; }
button.li:active { background: var(--card2); }
.badge-ic { width: 30px; height: 30px; border-radius: 9px; display: grid; place-items: center; flex: none; color: #fff; }

/* Buttons */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  min-height: 46px; padding: 0 20px; border-radius: 999px;
  font-size: 15.5px; font-weight: 600; letter-spacing: -0.005em;
  background: var(--fg); color: var(--on-fg);
  transition: transform 0.12s ease, opacity 0.12s ease;
}
.btn:active { transform: scale(0.97); }
.btn:disabled { opacity: 0.45; pointer-events: none; }
.btn.red { background: var(--red); color: #fff; }
.btn.ghost { background: var(--card2); color: var(--fg); }
.btn.line { background: transparent; color: var(--fg); box-shadow: inset 0 0 0 1px var(--line2); }
.btn.sm { min-height: 36px; padding: 0 14px; font-size: 14px; }
.btn.block { width: 100%; }
.btn.danger { background: transparent; color: var(--crit); }
.chip {
  display: inline-flex; align-items: center; gap: 6px; padding: 7px 12px; border-radius: 999px;
  background: var(--chip); font-size: 13.5px; font-weight: 600; white-space: nowrap; color: var(--fg);
}
.chip[aria-pressed="true"] { background: var(--fg); color: var(--on-fg); }
.chips { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; padding: 2px 0 4px; }
.chips::-webkit-scrollbar { display: none; }
/* All Mind sections stay visible on narrow phones after changing sections. */
#main[data-view="mind"] > .chips { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px; overflow: visible; }
#main[data-view="mind"] > .chips .chip { justify-content: center; padding: 8px 2px; font-size: 12.5px; }
.pill { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 600; padding: 3px 9px; border-radius: 999px; background: var(--card2); color: var(--fg2); }
.pill.good { background: color-mix(in srgb, var(--good) 18%, transparent); color: var(--good); }
.pill.warn { background: color-mix(in srgb, var(--warn) 18%, transparent); color: var(--warn); }
.pill.crit { background: color-mix(in srgb, var(--crit) 18%, transparent); color: var(--crit); }
.pill.red { background: var(--red-soft); color: var(--red); }

.seg { display: flex; background: var(--card2); border-radius: 12px; padding: 3px; gap: 2px; }
.seg button { flex: 1; min-width: 0; padding: 8px 4px; border-radius: 9px; font-size: 13.5px; font-weight: 600; color: var(--fg2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.seg button[aria-pressed="true"] { background: var(--card); color: var(--fg); box-shadow: 0 1px 4px rgba(0,0,0,0.18); }
:root[data-theme="light"] .seg button[aria-pressed="true"] { background: #fff; }
.field { display: flex; flex-direction: column; gap: 6px; }
.field label, .lbl { font-size: 13px; font-weight: 600; color: var(--fg2); }
.form { display: flex; flex-direction: column; gap: 14px; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.grid4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }

/* ---------- Charge hero ---------- */
.hero { padding: 20px 20px 18px; }
.hero-main { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: 4px; }
.hero-num { display: flex; align-items: flex-start; }
.hero-num .pct { font: 300 30px/1 var(--font-display); margin-top: 10px; color: var(--fg2); }
.battery { position: relative; height: 12px; border-radius: 6px; background: var(--card2); margin: 18px 0 16px; overflow: hidden; }
.battery i { position: absolute; inset: 0 auto 0 0; border-radius: 6px; background: var(--fg); transition: width 0.6s cubic-bezier(.2,.8,.2,1); }
.battery.low i { background: var(--red); }
.battery span { position: absolute; top: 0; bottom: 0; width: 2px; background: var(--card); }
.legend { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.legend button { text-align: left; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.legend .k { display: flex; align-items: center; gap: 6px; font-size: 11.5px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--fg3); }
.legend .k i { width: 7px; height: 7px; border-radius: 50%; }
.legend .v { font: 600 16px/1.2 var(--font-display); font-variant-numeric: tabular-nums; white-space: nowrap; }
.legend .g { font-size: 12px; color: var(--fg3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.rings { flex: none; }
.rings circle { transition: stroke-dashoffset 0.8s cubic-bezier(.2,.8,.2,1); }

/* Quick tiles */
.tiles { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
.tile {
  background: var(--card); border-radius: 18px; padding: 12px 6px 10px; min-width: 0;
  display: flex; flex-direction: column; align-items: center; gap: 7px; font-size: 12px; font-weight: 600; color: var(--fg2);
}
.tile .ti { width: 40px; height: 40px; border-radius: 13px; display: grid; place-items: center; color: #fff; }
.tile:active { transform: scale(0.96); }
.tile span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
.tile > span:last-child { white-space: normal; line-height: 1.25; }

/* Habits */
.check {
  width: 30px; height: 30px; border-radius: 50%; flex: none; display: grid; place-items: center;
  box-shadow: inset 0 0 0 2px var(--line2); color: transparent; transition: background 0.15s, box-shadow 0.15s;
}
.check.on { background: var(--hc, var(--fuel)); box-shadow: none; color: #fff; }
.check.on .ic { animation: pop 0.25s ease; }
@keyframes pop { from { transform: scale(0.4); } to { transform: scale(1); } }
.done .t { color: var(--fg3); text-decoration: line-through; text-decoration-color: var(--fg3); }
.streak { display: inline-flex; align-items: center; gap: 3px; font-size: 12.5px; font-weight: 600; color: var(--warn); font-variant-numeric: tabular-nums; }
.overdue .s { color: var(--crit); }

/* Autopilot */
.ap { position: relative; overflow: hidden; }
.ap-h { display: flex; align-items: center; gap: 10px; }
.ap-mark { width: 30px; height: 30px; border-radius: 9px; display: grid; place-items: center; background: var(--red); color: #fff; flex: none; }
.ap-plan { display: grid; grid-template-columns: auto 1fr; gap: 8px 14px; margin: 14px 0 4px; font-size: 15px; }
.ap-plan .tm { font-family: var(--font-mono); font-size: 12.5px; color: var(--fg3); padding-top: 2px; white-space: nowrap; }
.ap-lines { display: flex; flex-direction: column; gap: 8px; margin-top: 12px; font-size: 14.5px; }
.ap-lines div { display: flex; gap: 10px; align-items: flex-start; }
.ap-lines b { min-width: 50px; font-size: 11.5px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--fg3); padding-top: 3px; font-weight: 600; }
.thinking { display: inline-flex; gap: 4px; align-items: center; }
.thinking i { width: 6px; height: 6px; border-radius: 50%; background: var(--fg3); animation: blink 1.2s infinite; }
.thinking i:nth-child(2) { animation-delay: 0.15s; } .thinking i:nth-child(3) { animation-delay: 0.3s; }
@keyframes blink { 0%, 80%, 100% { opacity: 0.25; } 40% { opacity: 1; } }

/* Charts */
.chart { width: 100%; height: auto; display: block; overflow: visible; }
.chart text { fill: var(--fg3); font-size: 10px; font-family: var(--font-text); }
.chart .grid { stroke: var(--line); stroke-width: 1; }
.chart .goal { stroke: var(--fg3); stroke-dasharray: 3 4; stroke-width: 1; }
.heat { display: grid; grid-auto-flow: column; grid-template-rows: repeat(7, 1fr); gap: 3px; }
.heat i { aspect-ratio: 1; border-radius: 3px; background: var(--card2); }
.statrow { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.stat { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.stat .v { font: 600 20px/1.1 var(--font-display); font-variant-numeric: tabular-nums; letter-spacing: -0.01em; }
.stat .k { font-size: 11.5px; color: var(--fg3); font-weight: 600; letter-spacing: 0.05em; text-transform: uppercase; }

/* Macro bars */
.mbar { display: flex; flex-direction: column; gap: 6px; }
.mbar .track { height: 6px; border-radius: 3px; background: var(--card2); overflow: hidden; }
.mbar .track i { display: block; height: 100%; border-radius: 3px; transition: width 0.6s cubic-bezier(.2,.8,.2,1); }
.drops { display: flex; gap: 6px; flex-wrap: wrap; }
.drops button { width: 44px; height: 44px; display: grid; place-items: center; color: var(--card3); }
.drops button.on { color: var(--mind); }

/* ---------- Sheet ---------- */
.sheet-wrap { position: fixed; inset: 0; z-index: 60; }
.scrim { position: absolute; inset: 0; background: var(--scrim); opacity: 0; transition: opacity 0.25s ease; }
.sheet {
  position: absolute; left: 0; right: 0; bottom: 0; margin: 0 auto; max-width: 620px;
  max-height: calc(100% - 40px - env(safe-area-inset-top, 0px));
  background: var(--bg2); border-radius: 26px 26px 0 0; box-shadow: var(--shadow);
  transform: translateY(102%); transition: transform 0.32s cubic-bezier(.2,.9,.25,1);
  display: flex; flex-direction: column;
}
:root[data-theme="light"] .sheet { background: var(--bg); }
@media (prefers-color-scheme: light) { :root:not([data-theme="dark"]) .sheet { background: var(--bg); } }
.sheet-wrap.open .scrim { opacity: 1; }
.sheet-wrap.open .sheet { transform: none; }
.grab { width: 38px; height: 5px; border-radius: 3px; background: var(--line2); margin: 8px auto 2px; flex: none; }
#sheet {
  overflow-y: auto; -webkit-overflow-scrolling: touch;
  padding-left: max(18px, env(safe-area-inset-left, 0px));
  padding-right: max(18px, env(safe-area-inset-right, 0px));
  padding-block: 6px calc(24px + env(safe-area-inset-bottom, 0px));
}
.sh-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 8px 0 16px; }
.sh-head .h2 { flex: 1; min-width: 0; }

/* ---------- Full-screen overlay ---------- */
.ov {
  position: fixed; inset: 0; z-index: 50; background: var(--bg); overflow-y: auto;
  padding-top: env(safe-area-inset-top, 0px);
}
.ov-in {
  max-width: 620px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 8px calc(120px + env(safe-area-inset-bottom, 0px));
}
.ov-bar { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 10px 0 14px; }

/* Workout logger */
.ex { padding: 16px 0 8px; }
.ex + .ex { border-top: 1px solid var(--line); }
.sets { display: grid; grid-template-columns: 30px 1fr 74px 64px 40px; gap: 6px 8px; align-items: center; margin-top: 10px; }
.sets .hd { font-size: 11.5px; font-weight: 600; letter-spacing: 0.05em; color: var(--fg3); text-transform: uppercase; }
.sets input { padding: 8px 6px; text-align: center; border-radius: 10px; font-variant-numeric: tabular-nums; }
.sets .prev { font-size: 13px; color: var(--fg3); font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sets .n { font-weight: 600; color: var(--fg2); text-align: center; font-variant-numeric: tabular-nums; }
.setck { width: 36px; height: 34px; border-radius: 10px; background: var(--card2); display: grid; place-items: center; color: var(--fg3); }
.setck.on { background: var(--fuel); color: #fff; }
.set-done input { background: color-mix(in srgb, var(--fuel) 14%, transparent); }
.restpill {
  position: fixed; z-index: 55; left: 50%; transform: translateX(-50%);
  bottom: calc(18px + env(safe-area-inset-bottom, 0px));
  display: flex; align-items: center; gap: 10px; padding: 8px 8px 8px 18px; border-radius: 999px;
  background: var(--fg); color: var(--on-fg); box-shadow: var(--shadow); font-weight: 600;
}
.restpill .num-s { min-width: 48px; }
.restpill button { background: rgba(127,127,127,0.18); border-radius: 999px; padding: 7px 11px; font-size: 13px; font-weight: 700; }

/* Focus ring */
.bigring { position: relative; width: min(260px, 72vw); aspect-ratio: 1; margin: 6px auto 18px; }
.bigring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.bigring .mid { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; }

/* Breathe */
.breath-stage { min-height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 28px; padding: 40px 16px calc(40px + env(safe-area-inset-bottom, 0px)); text-align: center; }
.orb {
  width: min(280px, 70vw); aspect-ratio: 1; border-radius: 50%;
  background: radial-gradient(circle at 50% 45%, color-mix(in srgb, var(--mind) 70%, transparent), color-mix(in srgb, var(--mind) 10%, transparent) 70%);
  box-shadow: 0 0 80px color-mix(in srgb, var(--mind) 35%, transparent);
  transform: scale(0.55); transition-property: transform; transition-timing-function: cubic-bezier(.45,0,.55,1);
}

/* Brain games */
.game-pad { min-height: 260px; border-radius: var(--r-lg); display: grid; place-items: center; text-align: center; padding: 20px; user-select: none; }
.keypad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.keypad button { height: 54px; border-radius: 14px; background: var(--card2); font: 500 22px var(--font-display); }
.keypad button:active { background: var(--card3); }

/* Hoops court */
.court { position: relative; width: 100%; max-width: 420px; aspect-ratio: 50 / 42; margin: 0 auto; }
.court svg { position: absolute; inset: 0; width: 100%; height: 100%; }
.court svg * { fill: none; stroke: var(--line2); stroke-width: 1.4; }
.zone {
  position: absolute; transform: translate(-50%, -50%); min-width: 58px; padding: 6px 8px; border-radius: 12px;
  background: var(--card2); text-align: center; font-size: 11px; font-weight: 600; color: var(--fg2); line-height: 1.2;
}
.zone b { display: block; font: 600 15px var(--font-display); color: var(--fg); font-variant-numeric: tabular-nums; }
.zone.sel { box-shadow: 0 0 0 2px var(--fg); }
.zone.hot { background: color-mix(in srgb, var(--red) 30%, var(--card2)); }
.zone.cold { background: color-mix(in srgb, var(--mind) 26%, var(--card2)); }

/* Badges */
.badges { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px 8px; }
.bdg { display: flex; flex-direction: column; align-items: center; gap: 6px; text-align: center; font-size: 11.5px; font-weight: 600; color: var(--fg2); min-width: 0; }
.bdg .medal { width: 54px; height: 54px; border-radius: 50%; display: grid; place-items: center; background: var(--card2); color: var(--fg3); }
.bdg.on .medal { background: conic-gradient(from 210deg, var(--gold), #fff4b0, var(--gold), #b98a00, var(--gold)); color: #3a2a00; }
.bdg.on { color: var(--fg); }

/* Chat */
.chat { display: flex; flex-direction: column; gap: 10px; padding-bottom: 8px; }
.msg { max-width: 86%; padding: 10px 14px; border-radius: 20px; font-size: 15.5px; line-height: 1.45; white-space: pre-wrap; overflow-wrap: anywhere; }
.msg.me { align-self: flex-end; background: var(--red); color: #fff; border-bottom-right-radius: 6px; }
.msg.ai { align-self: flex-start; background: var(--card); border-bottom-left-radius: 6px; }
.msg.tool { align-self: flex-start; background: transparent; color: var(--fg3); font-size: 13px; padding: 0 6px; display: flex; gap: 6px; align-items: center; }
.composer { position: sticky; bottom: 0; display: flex; gap: 8px; padding: 10px 0 0; background: inherit; }
.composer input { border-radius: 999px; padding-left: 18px; }

/* Toast */
.toast {
  position: fixed; z-index: 90; left: 50%; transform: translate(-50%, -12px); opacity: 0;
  top: calc(12px + env(safe-area-inset-top, 0px));
  background: var(--fg); color: var(--on-fg); padding: 10px 18px; border-radius: 999px;
  font-size: 14.5px; font-weight: 600; box-shadow: var(--shadow); transition: opacity 0.2s, transform 0.2s; pointer-events: none;
  max-width: calc(100% - 32px); text-align: center;
}
.toast.show { opacity: 1; transform: translate(-50%, 0); }
/* On the car and TV screens, toasts sit low so they never cover the clock or tiles */
body:has(#stage[data-mode="tv"]:not([hidden])) .toast, body:has(#sleep:not([hidden])) .toast { top: auto; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); transform: translate(-50%, 12px); }
body:has(#stage[data-mode="tv"]:not([hidden])) .toast.show, body:has(#sleep:not([hidden])) .toast.show { transform: translate(-50%, 0); }

/* ---------- Widgets (iOS sizes) ---------- */
.wgrid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px; }
.w { background: var(--card); border-radius: 24px; padding: 14px; aspect-ratio: 1; display: flex; flex-direction: column; justify-content: space-between; min-width: 0; overflow: hidden; }
.w.med { grid-column: span 2; aspect-ratio: 2.12; }
.w.lg { grid-column: span 2; aspect-ratio: 1.05; }
.lock-row { display: flex; gap: 16px; align-items: center; justify-content: center; padding: 18px; border-radius: 22px; background: linear-gradient(160deg, #1b1f2a, #0a0b0f); color: #fff; }
.lock-circ { width: 64px; height: 64px; border-radius: 50%; background: rgba(255,255,255,0.12); display: grid; place-items: center; position: relative; }
.lock-rect { flex: 1; max-width: 170px; padding: 8px 12px; border-radius: 16px; background: rgba(255,255,255,0.12); font-size: 13px; line-height: 1.3; }

/* ---------- Scaled stages (CarPlay / TV) ---------- */
.stage-wrap { position: fixed; inset: 0; z-index: 70; background: #000; overflow: hidden; color: #f5f5f7; }
.stage { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
.cp { width: 800px; height: 480px; display: grid; grid-template-columns: 84px 1fr; background: #000; font-family: var(--font-text); }
.cp-dock { background: #111214; display: flex; flex-direction: column; align-items: center; justify-content: space-between; padding: 14px 0; }
.cp-dock .clock { font: 600 17px var(--font-display); }
.cp-app { width: 56px; height: 56px; border-radius: 14px; display: grid; place-items: center; color: #fff; background: #2a2b30; }
.cp-main { padding: 14px; display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: 1fr auto; gap: 12px; }
.cp-w { background: #1a1b1e; border-radius: 22px; padding: 18px; display: flex; flex-direction: column; justify-content: space-between; overflow: hidden; }
.cp-now { grid-column: span 2; background: #1a1b1e; border-radius: 22px; padding: 14px 16px; display: flex; align-items: center; gap: 16px; }
.cp-btn { width: 64px; height: 64px; border-radius: 50%; background: #f5f5f7; color: #000; display: grid; place-items: center; flex: none; }
.cp-btn.alt { background: #2a2b30; color: #fff; width: 54px; height: 54px; }

.tv { width: 1920px; height: 1080px; background: radial-gradient(1200px 700px at 15% 10%, #1a0a0c, #000 60%); color: #f5f5f7; padding: 72px 96px 132px; display: grid; grid-template-columns: 620px 1fr; gap: 72px; font-family: var(--font-text); }
.tv-tile { background: #141416; border-radius: 28px; padding: 28px 32px; outline: none; transition: transform 0.15s ease, box-shadow 0.15s ease; text-align: left; color: inherit; }
.tv-tile.tvf { transform: scale(1.04); box-shadow: 0 0 0 5px #f5f5f7, 0 30px 60px rgba(0,0,0,0.6); }
.tv .tvn:not(.tv-tile) { transition: background 0.15s ease; }
.tv .tvn.tvf:not(.tv-tile) { background: #2a2a2e; box-shadow: inset 6px 0 0 #e82127; }
.sync.dot-only > span { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
.tv-hint { position: absolute; left: 96px; right: 96px; bottom: 34px; display: flex; gap: 40px; font-size: 22px; color: #8e8e93; }
.tv-hint b { color: #f5f5f7; font-weight: 600; }

/* ---------- Brand + motion ---------- */
.wordmark { font: 600 12px/1 var(--font-display); letter-spacing: 0.46em; text-transform: uppercase; color: var(--fg); padding-left: 0.46em; }
.wordmark em { font-style: normal; color: var(--red); }
.mark { width: 30px; height: 30px; border-radius: 9px; background: var(--fg); color: var(--bg); display: grid; place-items: center; font: 700 15px/1 var(--font-display); letter-spacing: -0.04em; }
.mark.red { background: var(--red); color: #fff; }
.view-in > * { animation: rise 0.42s cubic-bezier(.2,.8,.2,1) both; }
.view-in > *:nth-child(2) { animation-delay: 0.03s; }
.view-in > *:nth-child(3) { animation-delay: 0.06s; }
.view-in > *:nth-child(4) { animation-delay: 0.09s; }
.view-in > *:nth-child(5) { animation-delay: 0.12s; }
.view-in > *:nth-child(n+6) { animation-delay: 0.15s; }
@keyframes rise { from { opacity: 0.001; transform: translateY(10px); } to { opacity: 1; transform: none; } }
.ov { animation: ovIn 0.36s cubic-bezier(.2,.9,.25,1) both; }
.ov.out { animation: ovOut 0.24s ease both; }
@keyframes ovIn { from { opacity: 0; transform: translateY(24px) scale(0.985); } to { opacity: 1; transform: none; } }
@keyframes ovOut { to { opacity: 0; transform: translateY(18px) scale(0.99); } }
.stage-wrap { animation: fadeIn 0.4s ease both; }
@keyframes fadeIn { from { opacity: 0; } }
.tabbar button .ic { transition: transform 0.25s cubic-bezier(.2,.8,.2,1), color 0.2s; }
.tabbar button[aria-current="page"] .ic { transform: translateY(-1px) scale(1.06); }
.li, .tile, .chip, .btn, .icon-btn, .check, .setck { transition: transform 0.14s ease, background 0.18s ease, color 0.18s ease, box-shadow 0.18s ease; }
.splash { position: fixed; inset: 0; z-index: 100; background: #000; display: grid; place-items: center; pointer-events: none; animation: splashOut 0.45s ease 0.65s forwards; }
@keyframes splashOut { to { opacity: 0; visibility: hidden; } }
.splash .wordmark { color: #f5f5f7; font-size: 15px; animation: rise 0.6s cubic-bezier(.2,.8,.2,1) both; }

/* ---------- v2: setup, readiness, training, insights, motion ---------- */
.ov-in.su { min-height: 100%; display: flex; flex-direction: column; padding-bottom: 0; }
.su-top { display: flex; align-items: center; gap: 14px; padding: 14px 0 6px; min-height: 52px; }
.su-prog { flex: 1; display: flex; gap: 5px; }
.su-prog i { flex: 1; height: 3px; border-radius: 2px; background: var(--card3); transition: background 0.4s ease; }
.su-prog i.on { background: var(--fg); }
.su-prog i.cur { background: color-mix(in srgb, var(--fg) 40%, var(--card3)); }
.su-step { flex: 1; padding: 18px 0 24px; }
.su-step.fwd { animation: suFwd 0.42s cubic-bezier(.2,.8,.2,1) both; }
.su-step.back { animation: suBack 0.42s cubic-bezier(.2,.8,.2,1) both; }
@keyframes suFwd { from { opacity: 0; transform: translateX(36px); } }
@keyframes suBack { from { opacity: 0; transform: translateX(-36px); } }
.su-q { font-size: 30px; margin-bottom: 10px; }
.su-note { margin: 0 0 20px; font-size: 15px; }
.su-hero { text-align: center; padding-top: 12vh; display: flex; flex-direction: column; align-items: center; }
.su-foot { position: sticky; bottom: 0; z-index: 2; padding: 22px 0 calc(16px + env(safe-area-inset-bottom, 0px)); background: linear-gradient(to bottom, transparent, var(--bg) 26%); }
.su-foot-in { display: flex; gap: 10px; }
.su-foot-in.col { flex-direction: column; }
.choice { display: flex; align-items: center; gap: 14px; width: 100%; text-align: left; padding: 16px 18px; border-radius: 18px; background: var(--card); box-shadow: inset 0 0 0 1.5px transparent; transition: box-shadow 0.18s ease, transform 0.14s ease; }
.choice:active { transform: scale(0.985); }
.choice[aria-pressed="true"] { box-shadow: inset 0 0 0 2px var(--fg); }
.choice .radio { width: 22px; height: 22px; border-radius: 50%; flex: none; box-shadow: inset 0 0 0 2px var(--line2); transition: box-shadow 0.18s ease; }
.choice[aria-pressed="true"] .radio { box-shadow: inset 0 0 0 7px var(--fg); }
.rd { display: flex; align-items: center; gap: 16px; }
.rd-g { position: relative; flex: none; width: 112px; height: 112px; }
.rd-mid { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; padding-top: 4px; pointer-events: none; }
.gauge { display: block; }
.tline { display: flex; align-items: center; gap: 8px; margin-top: 8px; text-align: left; flex-wrap: wrap; }
.mgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px 20px; }
.mtrack { position: relative; height: 6px; border-radius: 3px; background: var(--card2); overflow: hidden; margin-top: 6px; }
.mtrack .band { position: absolute; top: 0; bottom: 0; left: 41.67%; width: 41.67%; background: color-mix(in srgb, var(--fuel) 18%, transparent); }
.mtrack i { position: relative; display: block; height: 100%; border-radius: 3px; transition: width 0.6s cubic-bezier(.2,.8,.2,1); }
.barbell { display: flex; align-items: center; gap: 3px; min-height: 140px; overflow-x: auto; padding: 0 2px; }
.barbell .sleeve { width: 44px; height: 12px; border-radius: 3px; background: var(--fg3); flex: none; }
.barbell .sleeve.end { width: 26px; }
.barbell .collar { width: 8px; height: 26px; border-radius: 2px; background: var(--fg2); flex: none; }
.plate { width: 24px; flex: none; border-radius: 5px; background: var(--fg); color: var(--on-fg); display: grid; place-items: center; font: 700 10px var(--font-text); writing-mode: vertical-rl; }
.plate.big { background: var(--red); color: #fff; }
.hgroup { min-height: 44px; padding-top: 12px; padding-bottom: 4px; }
.rt-icon { width: 104px; height: 104px; border-radius: 32px; display: grid; place-items: center; color: #fff; margin-top: 26px; box-shadow: 0 18px 50px rgba(0,0,0,0.35); animation: rise 0.5s cubic-bezier(.2,.8,.2,1) both; }
.cmp { display: flex; flex-direction: column; gap: 6px; margin-top: 12px; }
.cmp-row { display: grid; grid-template-columns: 82px 1fr 44px; align-items: center; gap: 10px; }
.cmp-row .track { height: 6px; border-radius: 3px; background: var(--card2); overflow: hidden; }
.cmp-row .track i { display: block; height: 100%; border-radius: 3px; transition: width 0.6s cubic-bezier(.2,.8,.2,1); }
.cmp-row span:last-child { text-align: right; }
.grab { position: relative; touch-action: none; cursor: grab; }
.grab::before { content: ""; position: absolute; inset: -12px -60px; }
.sh-head { touch-action: none; }
.moment { position: fixed; z-index: 96; left: 50%; top: 42%; min-width: 230px; transform: translate(-50%, -50%) scale(0.92); opacity: 0; pointer-events: none; text-align: center; padding: 26px 34px 22px; border-radius: 30px; background: var(--card); box-shadow: var(--shadow); transition: opacity 0.3s ease, transform 0.5s cubic-bezier(.2,1.3,.3,1); }
.moment.show { opacity: 1; transform: translate(-50%, -50%) scale(1); }
.moment-ring { width: 64px; height: 64px; margin: 0 auto 14px; border-radius: 50%; border: 6px solid var(--mc); box-shadow: 0 0 28px var(--mc); }
.moment.show .moment-ring { animation: mring 1.1s cubic-bezier(.2,.8,.2,1); }
@keyframes mring { from { transform: scale(0.4); opacity: 0; } 60% { transform: scale(1.08); opacity: 1; } }
.ring-pulse { animation: ringPulse 0.9s cubic-bezier(.2,.8,.2,1); transform-origin: center; }
@keyframes ringPulse { 35% { transform: scale(1.07); filter: drop-shadow(0 0 16px var(--pulse, var(--fuel))); } }
button.card { transition: transform 0.14s ease; }
button.card:active { transform: scale(0.985); }
.tabbar { view-transition-name: tabbar; }
::view-transition-old(root), ::view-transition-new(root) { animation-duration: 0.34s; animation-timing-function: cubic-bezier(.2,.8,.2,1); }
:root[data-dir="fwd"]::view-transition-old(root) { animation-name: vtOutL; }
:root[data-dir="fwd"]::view-transition-new(root) { animation-name: vtInR; }
:root[data-dir="back"]::view-transition-old(root) { animation-name: vtOutR; }
:root[data-dir="back"]::view-transition-new(root) { animation-name: vtInL; }
@keyframes vtOutL { to { opacity: 0; transform: translateX(-32px); } }
@keyframes vtInR { from { opacity: 0; transform: translateX(32px); } }
@keyframes vtOutR { to { opacity: 0; transform: translateX(32px); } }
@keyframes vtInL { from { opacity: 0; transform: translateX(-32px); } }

/* ---------- v3: week rings, now card, timeline ---------- */
.wstrip { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; margin: -6px 0 14px; }
.wday { display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 6px 0 7px; border-radius: 14px; min-width: 0; transition: transform 0.14s ease, background 0.2s ease; }
.wday .wd { font-size: 11px; font-weight: 600; color: var(--fg3); }
.wday .wn { font-size: 12px; font-weight: 600; color: var(--fg2); font-variant-numeric: tabular-nums; }
.wday.today { background: var(--card); }
.wday.today .wn { color: var(--red); }
.wday:active { transform: scale(0.94); }
.now { display: flex; align-items: center; gap: 14px; margin-top: 14px; }
.now-ic { width: 44px; height: 44px; border-radius: 14px; display: grid; place-items: center; color: #fff; flex: none; }
.now .btn { flex: none; }
.tl { display: flex; flex-direction: column; margin-top: 12px; position: relative; }
.tl::before { content: ""; position: absolute; left: 77px; top: 10px; bottom: 10px; width: 1px; background: var(--line2); }
.tl-row { display: grid; grid-template-columns: 66px 1fr; gap: 22px; align-items: center; padding: 6px 0; width: 100%; text-align: left; font-size: 15px; position: relative; min-width: 0; }
.tl-row::after { content: ""; position: absolute; left: 74px; top: 50%; width: 7px; height: 7px; margin-top: -3.5px; border-radius: 50%; background: var(--fg3); box-shadow: 0 0 0 3px var(--card); }
.tl-row .tm { font-family: var(--font-mono); font-size: 12px; color: var(--fg3); white-space: nowrap; text-align: right; }
.tl-block { display: flex; align-items: center; gap: 8px; padding: 8px 12px; border-radius: 12px; background: var(--red-soft); color: var(--fg); font-weight: 600; min-width: 0; white-space: nowrap; overflow: hidden; }
.tl-item { min-width: 0; }
.tl-item.bed { color: var(--sleep); display: inline-flex; align-items: center; gap: 6px; font-weight: 600; }
.tl-row.past { opacity: 0.42; }

/* ---------- polish: wide screens, centered chips, ring draw-in ---------- */
.cols, .col { display: contents; }
.view-in > .cols { animation: none; }
.view-in .col > * { animation: rise 0.42s cubic-bezier(.2,.8,.2,1) both; }
.view-in .col > *:nth-child(2) { animation-delay: 0.03s; }
.view-in .col > *:nth-child(3) { animation-delay: 0.06s; }
.view-in .col > *:nth-child(4) { animation-delay: 0.09s; }
.view-in .col > *:nth-child(n+5) { animation-delay: 0.12s; }
.chips.center > :first-child { margin-left: auto; }
.chips.center > :last-child { margin-right: auto; }
.view-in .mr { animation: mrIn 0.9s cubic-bezier(.2,.8,.2,1) both; }
@keyframes mrIn { from { stroke-dashoffset: var(--c); } }
@media (min-width: 900px) { body { padding-left: var(--rail); } }
@media (min-width: 1100px) {
  #main { max-width: 1180px; }
  #main[data-view="mind"] { max-width: 680px; }
  .cols { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 0 28px; align-items: start; }
  .col { display: block; min-width: 0; }
  .view-in > .cols { animation: none; }
  .col > .now:first-child, .col > .card:first-child { margin-top: 0; }
  .col > .sec:first-child { padding-top: 0; }
}

kbd.kbd { font: 600 12px var(--font-mono); padding: 3px 9px; border-radius: 7px; background: var(--card2); box-shadow: inset 0 -1.5px 0 var(--line2); color: var(--fg); }
@media (pointer: coarse) { .kbd-hint { display: none; } }

/* ---------- v4: scanner ---------- */
.shots { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.shot { position: relative; aspect-ratio: 3 / 4; max-width: 100%; border-radius: 18px; background: var(--card); box-shadow: inset 0 0 0 1.5px var(--line2); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; cursor: pointer; overflow: hidden; text-align: center; padding: 8px; }
.shot.has { box-shadow: none; }
.shot-pick { position: absolute; inset: 0; width: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; padding: 8px; }
.shot-pick:focus-visible { outline-offset: -4px; border-radius: 18px; }
.shot img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.shot.has .shot-l { position: absolute; left: 6px; right: 6px; bottom: 6px; background: rgba(0,0,0,0.6); color: #fff; border-radius: 8px; padding: 3px 4px; }
.shot-ic { width: 44px; height: 44px; border-radius: 14px; display: grid; place-items: center; background: var(--card2); color: var(--fg); }
.shot-l { font-size: 12px; font-weight: 600; color: var(--fg2); line-height: 1.2; }

function changeWeightUnits(to, { persist = true } = {}) {

      if (seen.has(set)) continue; seen.add(set);
      if (scale(set, 'w')) changed = true;
    }
    return changed;
  };
  for (const [key, day] of Object.entries(S.days)) {
    let changed = scale(day, 'weight');
    for (const w of day.workouts || []) if (workout(w)) changed = true;
    if (changed) keys.push(key);
  }
  workout(S.core.active); workout(S.lastWorkout);
  for (const pr of Object.values(S.core.prs || {})) { scale(pr, 'w'); scale(pr, 'e1'); }
  scale(S.core.goals, 'weight');
  for (const g of S.core.lt || []) {
    if (!['weight', 'lift'].includes(g.kind)) continue;
    const title = (value, unit) => g.kind === 'weight' ? `Reach ${value} ${unit}` : `${g.ex} ${value} ${unit}`;
    const oldTitles = [title(goalNumber(g.target), from), title(fmtN(g.target), from)];
    scale(g, 'target'); scale(g, 'start');
    if (oldTitles.includes(g.title)) g.title = title(goalNumber(g.target), to);
    if (g.unit === from) g.unit = to;
  }

}

  byId('food'); byId('workouts'); byT('acts'); byT('focus'); byT('mind'); byT('games');

let importSession = 0, importRead = 0;
function readBackup(j) {
  const record = v => !!v && typeof v === 'object' && !Array.isArray(v);
  const objectList = v => Array.isArray(v) && v.every(record);
  if (!record(j) || j.app !== 'IMP4EVR' || !record(j.core) || !record(j.days)) throw new Error('backup');
  if (j.core.name !== undefined && typeof j.core.name !== 'string') throw new Error('name');
  if (j.core.units !== undefined && !['lb', 'kg'].includes(j.core.units)) throw new Error('units');
  for (const f of ['goals', 'prs', 'best', 'plan', 'sleepPlan']) if (j.core[f] != null && !record(j.core[f])) throw new Error('settings');
  for (const g of Object.values(j.core.goals || {})) if (g !== null && (typeof g !== 'number' || !Number.isFinite(g) || g < 0)) throw new Error('goals');
  for (const f of ['habits', 'templates', 'tasks', 'meals']) if (j.core[f] !== undefined && !objectList(j.core[f])) throw new Error('core');
  for (const h of j.core.habits || []) if (typeof h.name !== 'string' || (h.days !== undefined && (!Array.isArray(h.days) || h.days.some(d => !Number.isInteger(d) || d < 0 || d > 6)))) throw new Error('habit');
  for (const t of j.core.tasks || []) if (typeof t.title !== 'string') throw new Error('task');
  for (const t of j.core.templates || []) if (!objectList(t.ex)) throw new Error('templates');
  if (j.products !== undefined && (!record(j.products) || !Object.values(j.products).every(p => record(p) && record(p.perServing)))) throw new Error('products');
  const days = {};
  for (const [k, d] of Object.entries(j.days)) {
    if (!/^\d{4}-\d\d-\d\d$/.test(k) || dkey(parseKey(k)) !== k || !record(d)) throw new Error('day');
    for (const f of ['food', 'workouts', 'acts', 'focus', 'mind', 'games', 'fasts']) if (d[f] != null && !objectList(d[f])) throw new Error('day list');
    if (d.habits !== undefined && !record(d.habits)) throw new Error('habits');
    days[k] = dayFix(Object.assign(blankDay(k), d, { date: k }));
  }

}

const CONNECTOR_GUIDE = `# IMP4EVR connector guide (Bridge v1)

IMP4EVR is a single HTML file. Every outside source (Apple Health, Spotify, calendars, weather, ChatGPT, a native iPhone/Watch/CarPlay/Roku shell) talks to it the same way: call window.IMP4EVR, and send data as Bridge v1 JSON. The app merges it per day and it immediately feeds the rings, readiness, sleep, Autopilot, widgets, CarPlay and TV screens. Nothing typed by hand is ever overwritten by an import.

## Start here (for ChatGPT or any assistant)
1. Live connectors need no code. Open IMP4EVR in Claude and tap You -> Connections -> Connect everything. Spotify, Google Calendar and Google Drive then run through the person's own Claude connectors after one approval.
2. Apple Health: read the person's Health data with your own Apple Health connector and save it as Bridge v1 JSON (section 2) in a Google Drive file titled "IMP4EVR inbox YYYY-MM-DD". While IMP4EVR is open it checks Drive every 30 minutes and on launch, so the data shows up by itself. The "ChatGPT prompt" button in Connections holds the exact request.
3. Any other source (Fitbit, Garmin, Oura, Whoop, Strava, MyFitnessPal, a smart scale): same format, same inbox. Read it with your connector, map it to the Day fields, save the file. Use a short source id like "oura".
4. Can't write to Drive? Reply with the JSON; the person pastes it under Connections -> Paste data.
5. Building the iPhone app? Load imp4evr.html in a WKWebView and call window.IMP4EVR from Swift (sections 1 and 6). Every Apple framework already has its slot (section 3).

## 1. The bridge: window.IMP4EVR
- ingest(source, bridgeJson) -> { days }   Store data. Merged per day. source is a short id like "apple-health".
- setNowPlaying(NowPlaying | null)          Live only, never stored. Shown on CarPlay.
- setWeather(Weather | null)                Live only. Shown on CarPlay and TV.
- setEvents(date, Event[])                  Live calendar events for one day -> Today timeline + Autopilot.
- snapshot()                                Today's state in one object, for widgets, CarPlay, Apple Watch, Roku.
- exportBridge({ days: 90 })                The person's data out, as Bridge v1.
- logWater(glasses), logFood({ name, cal, p, c, f, meal }), logWorkout({ name, min, kcal }), completeHabit(name),
  addTask(title, 'YYYY-MM-DD'), checkIn({ energy, sore, mood }), startFocus(minutes), startSleep()
                                            Actions for Siri / App Intents, interactive widgets and Shortcuts.
- on(event, fn) -> unsubscribe              Events: 'change' (any saved change, payload = snapshot), 'sleep' ({ phase, alarmAt }),
                                            'alarm' ({ at }), 'focus' ({ running, endsAt, minutes }).
The inputs are forgiving: ingest also takes the JSON as text (code fences and curly quotes are fine) or a bare array of days; setNowPlaying takes a raw Spotify Web API "currently playing" response; setEvents takes a raw Google Calendar events response.
Native shells get every event as a message too: webkit.messageHandlers.imp4evr (iOS WKWebView), window.ReactNativeWebView.postMessage, or window.IMP4EVRAndroid.post.
Example (Swift, after reading HealthKit): webView.evaluateJavaScript("IMP4EVR.ingest('apple-health', \\(json))").
Example (sleep alarm): listen for 'sleep' and schedule an AlarmKit alarm at alarmAt so it rings even if the app is closed.

## 2. Bridge v1 format
{ "bridge": "imp4evr", "version": 1, "source": "apple-health", "days": [ Day, ... ] }
Day (only date is required; leave out anything you do not have):
  date "YYYY-MM-DD", steps, distanceKm, flights, activeKcal, exerciseMin, standHours, restingHR (bpm), hrv (ms, SDNN), vo2max,
  weight + weightUnit ("lb" | "kg"), waterMl or water (glasses), mindfulMin, mood (1-5),
  sleep { bed "HH:MM", wake "HH:MM", min (minutes asleep), stages { deep, rem, core, awake } (minutes) },
  workouts [ { name, start (ISO 8601), min, kcal } ],
  nutrition { kcal, protein, carbs, fat } (only from another food app; skipped on days food was logged in IMP4EVR)
NowPlaying = { title, artist, album, uri, isPlaying, progressMs, durationMs, source }
Weather    = { tempF, condition, highF, lowF, precipPct, updatedAt (ISO), source }
Event      = { title, start (ISO or "HH:MM"), end, allDay, free }
Times are the person's local time. 24-hour "HH:MM".

## 4. ChatGPT and Claude hand-off (no code needed)
- Google Drive inbox: any Drive file (plain text, Google Doc or .json) whose title contains "IMP4EVR inbox" and holds Bridge v1 JSON. Curly quotes and Markdown escaping from Docs are cleaned up automatically. IMP4EVR reads it with the Google Drive connector (You -> Connections -> Check Drive, and automatically every few hours) and merges it. Files are never deleted; each file version is read once.
- No Drive write access? Ask ChatGPT to reply with the same Bridge v1 JSON in the chat, then tap You -> Connections -> Paste data and paste it (a saved .json file works too). Code fences and curly quotes are fine.
- Google Drive export: You -> Connections -> Export saves "IMP4EVR export <date>.json" (Bridge v1) to Drive, so ChatGPT or Claude can read the person's data.
- Claude with connectors can also write Bridge v1 JSON straight into this artifact's database, collection "inbox" ({ source, payload }); the app merges it and clears the document.

## 5. Where things live in the code
- Bridge, ingest, connectors, Apple Health import: the "V5: CONNECTOR LAYER" section (this one).
- Storage and sync: Store (top of the script). Per-day documents keyed YYYY-MM-DD; settings in core.
- AI: initAI() and S.sample. Prompts live next to each feature.
- Rings, charge, readiness: rings(), charge(), readiness(). Health fields live in day.health.
- Live connectors through Claude: LIVE (the list), Conn (status, Connect everything, Spotify, Calendar, Drive). Add a connector by adding its name to LIVE and to the page's mcp manifest, then a small block in Conn.
- Goals, 30/75-day challenges, quit counters, the recap story and the interval timer: the "V7: GROW" section. snapshot() includes goals, challenge and quit.
- Timers: every countdown and stopwatch is computed from saved start and end times, so they stay exact when the phone locks. The "TIMERS" section repaints clock screens on the minute and resumes rest and interval timers after a reload.

## 6. Plug-in snippets for the iPhone app
HealthKit (Swift): query steps, sleep, heart rate, HRV and workouts for each day, build Bridge v1 days, then
    let json = String(data: try JSONSerialization.data(withJSONObject: ["bridge": "imp4evr", "version": 1, "source": "apple-health", "days": days]), encoding: .utf8)!
    webView.evaluateJavaScript("IMP4EVR.ingest('apple-health', \\(json))")
Write back: on IMP4EVR.on('change'), save new workouts (HKWorkout), water (dietaryWater) and mindful minutes to HealthKit.
Spotify Web API (JS, with an OAuth token): IMP4EVR.setNowPlaying(await (await fetch('https://api.spotify.com/v1/me/player/currently-playing', { headers: { Authorization: 'Bearer ' + token } })).json())
EventKit (Swift): map today's EKEvents to { title, start, end, allDay } with ISO dates, then IMP4EVR.setEvents('YYYY-MM-DD', events).
WeatherKit (Swift): IMP4EVR.setWeather({ tempF, condition, highF, lowF, precipPct, source: 'weatherkit' }) every 30 minutes.
AlarmKit (Swift): in the 'sleep' message from webkit.messageHandlers.imp4evr, schedule an alarm at alarmAt when phase is 'wind' or 'sleep'; cancel it when phase is 'off' or 'done'.
WidgetKit, CarPlay, Apple Watch: on every 'change' message, store the snapshot in an App Group and reload timelines; draw from its fields (charge, readiness, rings, nextWorkout, nextEvent, nowPlaying, weather, sun, goals, challenge, quit).
App Intents (Siri, Shortcuts, Action button): each intent calls one action, e.g. IMP4EVR.logWater(1), IMP4EVR.startFocus(25), IMP4EVR.startSleep().
Roku: a small endpoint stores the latest snapshot(); the BrightScript channel polls it for the TV dashboard and sleep mode.

    let e = $('#cmd'); if (e) return e;
    e = document.createElement('div'); e.id = 'cmd'; e.className = 'cmd'; e.hidden = true;
    e.innerHTML = `<div class="cmd-scrim" data-act="cmdClose"></div><div class="cmd-panel"><label class="cmd-in">${ic('bolt', 19)}<input id="cmdIn" type="text" placeholder="Log anything, or go anywhere" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="go" aria-label="Command" aria-controls="cmdList"><button class="cmd-x" type="button" data-act="cmdClose" aria-label="Close">${ic('x', 16)}</button></label><div class="cmd-list" id="cmdList" role="listbox" aria-label="Results"></div></div>`;
    document.body.appendChild(e);
    const inp = $('#cmdIn', e);
    inp.addEventListener('input', () => { this.sel = 0; this.paint(); });
    inp.addEventListener('keydown', ev => {
      if (ev.key === 'ArrowDown' || ev.key === 'ArrowUp') { ev.preventDefault(); const n = this.items.length; if (n) { this.sel = (this.sel + (ev.key === 'ArrowDown' ? 1 : n - 1)) % n; this.paint(true); } }
      else if (ev.key === 'Enter') { ev.preventDefault(); this.run(this.sel); }
      else if (ev.key === 'Escape') { ev.preventDefault(); ev.stopPropagation(); this.close(); }
    });
    return e;
  },
  isOpen() { const e = $('#cmd'); return !!e && !e.hidden; },
  open(text = '') {
    const e = this.el(), inp = $('#cmdIn'); if (!e.hidden && !e.classList.contains('out')) { inp.focus(); return; }
    inp.value = text; this.sel = 0; e.hidden = false; e.classList.remove('out'); this.paint();
    Modal.open(e, { label: 'Command bar', focus: inp });
  },
  close(now) {
    const e = $('#cmd'); if (!e || e.hidden) return;
    if (now) { e.hidden = true; e.classList.remove('out'); Modal.close(e); return; }
    e.classList.add('out'); setTimeout(() => { if (!e.classList.contains('out')) return; e.hidden = true; e.classList.remove('out'); Modal.close(e); }, 180);
  },
  paint(keepList) {
    const inp = $('#cmdIn'), list = $('#cmdList'); if (!inp || !list) return;
    if (!keepList) this.items = cmdParse(inp.value);
    this.sel = clamp(this.sel, 0, Math.max(0, this.items.length - 1));
    list.innerHTML = (this.items.length ? this.items.map((it, i) => `<button class="cmd-it" role="option" aria-selected="${i === this.sel}" data-act="cmdRun" data-i="${i}"><span class="badge-ic" style="background:${it.color}">${ic(it.icn, 16)}</span><span class="grow"><span class="t">${esc(it.t)}</span>${it.sub ? `<span class="s">${esc(it.sub)}</span>` : ''}</span><span class="end">${ic('enter', 15)}</span></button>`).join('')
      : `<div class="empty">Nothing matches that yet.</div>`) + (inp.value.trim() ? '' : `<div class="cmd-try"><span class="cap">Try typing</span><div class="chips" style="flex-wrap:wrap;overflow:visible">${CMD_TRY.map(t => `<button class="chip" data-act="cmdTry">${esc(t)}</button>`).join('')}</div></div>`);
    const cur = list.querySelector('[aria-selected="true"]'); if (cur && keepList) cur.scrollIntoView({ block: 'nearest' });
  },
  run(i) { const it = this.items[i]; if (!it) return; this.close(true); try { it.go(); } catch (e) { toast('That didn’t work. Try it from the tab instead.'); } }
};
ACT.cmd = () => Cmd.open();
ACT.cmdClose = () => Cmd.close();
ACT.cmdRun = el => Cmd.run(+el.dataset.i);
ACT.cmdTry = el => { const inp = $('#cmdIn'); inp.value = el.textContent; Cmd.sel = 0; Cmd.paint(); inp.focus(); };
const cmdPill = () => `<div class="cmd-row"><button class="cmd-pill" data-act="cmd">${ic('bolt', 17)}<span class="grow">Log anything: “3 eggs”, “ran 30”</span><kbd class="kbd kbd-hint">/</kbd></button>${ovrChip()}</div>`;
KEYS.splice(1, 0, ['/', 'Command bar: log or go anywhere'], ['P', 'Open your player card']);
document.addEventListener('keydown', e => {
  if (e.defaultPrevented || e.isComposing || e.repeat) return;
  const k = e.key.toLowerCase(), mod = e.metaKey || e.ctrlKey, top = Modal.active();
  if (mod && k === 'k' && !e.altKey && !e.shiftKey) { if (top && top !== $('#cmd')) return; e.preventDefault(); if (Cmd.isOpen()) Cmd.close(); else Cmd.open(); return; }
  if (mod || e.altKey || top) return;
  const a = document.activeElement; if (a && (/INPUT|TEXTAREA|SELECT/.test(a.tagName) || a.isContentEditable)) return;
  if (e.key === '/') { e.preventDefault(); Cmd.open(); } else if (k === 'p') { e.preventDefault(); Card.open(); }
});

// ---------- Live core: the charge card glows with the four rings, brighter as the day fills up ----------
// One small WebGL canvas, drawn at a fraction of screen resolution and 30 frames a second. It stops when the card
// is off screen, the tab is hidden or something is open on top, and stays still under reduced motion.
const isLight = () => { const t = document.documentElement.dataset.theme; return t ? t === 'light' : matchMedia('(prefers-color-scheme: light)').matches; };
const Core = {
  on: lsGet('fx') !== 'off', cv: null, gl: null, raf: 0, last: 0, t: Math.random() * 40, seen: true, w: [0, 0, 0, 0], c: 0, tw: [0, 0, 0, 0], tc: 0, dead: false,
  FRAG: `precision mediump float;
uniform vec2 R; uniform float T, C, L; uniform vec4 W; uniform vec3 K0, K1, K2, K3;
float h(vec2 p){ return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }
float n(vec2 p){ vec2 i = floor(p), f = fract(p); f = f * f * (3. - 2. * f); return mix(mix(h(i), h(i + vec2(1., 0.)), f.x), mix(h(i + vec2(0., 1.)), h(i + vec2(1., 1.)), f.x), f.y); }
float fbm(vec2 p){ float a = .5, s = 0.; for (int i = 0; i < 4; i++) { s += a * n(p); p = p * 2.02 + vec2(3.1, 1.7); a *= .5; } return s; }
float blob(vec2 p, vec2 c, float r){ float d = distance(p, c) / r; return exp(-d * d * 2.2); }
void main(){
  vec2 uv = gl_FragCoord.xy / R; float ar = R.x / R.y; vec2 p = vec2(uv.x * ar, uv.y);
  float t = T * (.05 + .06 * C);
  vec2 q = vec2(fbm(p * 1.25 + vec2(t, -t * .7)), fbm(p * 1.25 + vec2(-t * .8, t) + 4.7)) - .5;
  float f = fbm(p * 1.7 + q * 2.4 + t * .4);
  float b0 = blob(p, vec2(ar * .80, .80) + q * .55, .50 + .30 * W.x) * (.10 + .90 * W.x);
  float b1 = blob(p, vec2(ar * .56, .46) + q.yx * .55, .46 + .30 * W.y) * (.10 + .90 * W.y);
  float b2 = blob(p, vec2(ar * .16, .86) - q * .50, .46 + .30 * W.z) * (.10 + .90 * W.z);
  float b3 = blob(p, vec2(ar * .98, .34) - q.yx * .50, .44 + .30 * W.w) * (.10 + .90 * W.w);
  float s = b0 + b1 + b2 + b3;
  vec3 col = (K0 * b0 + K1 * b1 + K2 * b2 + K3 * b3) / max(s, .35);
  float a = s * (.30 + 1.1 * f) * (.20 + .50 * C);
  a *= smoothstep(.02, .50, uv.y) * mix(1., .62, L);
  a = clamp(a, 0., .78);
  gl_FragColor = vec4(col * a, a);
}`,
  init() {
    if (this.dead) return false;
    try {
      const cv = document.createElement('canvas'); cv.id = 'core'; cv.setAttribute('aria-hidden', 'true');
      const gl = cv.getContext('webgl', { alpha: true, premultipliedAlpha: true, antialias: false, depth: false, stencil: false, powerPreference: 'low-power' }); if (!gl) throw 0;
      const sh = (type, src) => { const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s); if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw 0; return s; };
      const pr = gl.createProgram(); gl.attachShader(pr, sh(gl.VERTEX_SHADER, 'attribute vec2 a; void main(){ gl_Position = vec4(a, 0., 1.); }')); gl.attachShader(pr, sh(gl.FRAGMENT_SHADER, this.FRAG)); gl.linkProgram(pr);
      if (!gl.getProgramParameter(pr, gl.LINK_STATUS)) throw 0;
      gl.useProgram(pr); gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer()); gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
      const loc = gl.getAttribLocation(pr, 'a'); gl.enableVertexAttribArray(loc); gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
      this.u = {}; for (const n of ['R', 'T', 'C', 'L', 'W', 'K0', 'K1', 'K2', 'K3']) this.u[n] = gl.getUniformLocation(pr, n);
      cv.addEventListener('webglcontextlost', e => { e.preventDefault(); this.stop(); this.dead = true; cv.remove(); });
      this.cv = cv; this.gl = gl;
      if ('IntersectionObserver' in window) new IntersectionObserver(es => { this.seen = es[es.length - 1].isIntersecting; if (this.seen) this.start(); }).observe(cv);
      return true;
    } catch (e) { this.dead = true; return false; }
  },
  rgb(v) { const m = /^#?([0-9a-f]{6})$/i.exec(cssColor(v)); if (!m) return [1, 1, 1]; const n = parseInt(m[1], 16); return [(n >> 16 & 255) / 255, (n >> 8 & 255) / 255, (n & 255) / 255]; },
  // after every render the canvas moves into the fresh hero card; the GL context goes with it
  attach() {
    const hero = S.view === 'today' ? $('#main .card.hero') : null;
    if (!this.on || !hero || (!this.cv && !this.init())) { this.stop(); if (this.cv && !hero) this.cv.remove(); return; }
    if (this.cv.parentNode !== hero) hero.prepend(this.cv);
    const r = rings(TODAY()); this.tw = [r.body, r.fuel, r.mind, r.sleep]; this.tc = charge(TODAY()) / 100;
    const w = Math.max(2, Math.round(hero.clientWidth * 0.5)), h = Math.max(2, Math.round(hero.clientHeight * 0.5));
    if (this.cv.width !== w || this.cv.height !== h) { this.cv.width = w; this.cv.height = h; this.gl.viewport(0, 0, w, h); }
    const gl = this.gl, k = ['var(--body)', 'var(--fuel)', 'var(--mind)', 'var(--sleep)'].map(c => this.rgb(c));
    k.forEach((c, i) => gl.uniform3f(this.u['K' + i], c[0], c[1], c[2])); gl.uniform1f(this.u.L, isLight() ? 1 : 0); gl.uniform2f(this.u.R, w, h);
    if (RM()) { this.w = this.tw.slice(); this.c = this.tc; this.draw(); this.cv.classList.add('on'); return; }
    this.start();
  },
  draw() { const gl = this.gl, u = this.u; gl.uniform1f(u.T, this.t); gl.uniform1f(u.C, this.c); gl.uniform4f(u.W, this.w[0], this.w[1], this.w[2], this.w[3]); gl.clearColor(0, 0, 0, 0); gl.clear(gl.COLOR_BUFFER_BIT); gl.drawArrays(gl.TRIANGLES, 0, 3); },
  start() { if (this.raf || !this.on || !this.cv || !this.cv.isConnected || RM()) return; this.raf = requestAnimationFrame(t => this.frame(t)); },
  stop() { cancelAnimationFrame(this.raf); this.raf = 0; },
  frame(now) {
    this.raf = 0;
    if (!this.cv.isConnected || document.hidden || !this.seen) return; // attach() or the observer restarts it
    if (now - this.last >= 32) {
      const dt = Math.min(0.1, (now - this.last) / 1000) || 0.033; this.last = now;
      if (document.body.style.overflow !== 'hidden') { // nothing open on top
        this.t += dt; for (let i = 0; i < 4; i++) this.w[i] += (this.tw[i] - this.w[i]) * 0.06; this.c += (this.tc - this.c) * 0.06;
        this.draw(); if (!this.cv.classList.contains('on')) this.cv.classList.add('on');
      }
    }
    this.raf = requestAnimationFrame(t => this.frame(t));
  }
};
document.addEventListener('visibilitychange', () => { if (!document.hidden) Core.start(); });
ACT.fxSet = el => { const v = el.dataset.v === 'off' ? 'off' : 'on'; lsSet('fx', v); Core.on = v === 'on'; if (!Core.on && Core.cv) { Core.stop(); Core.cv.remove(); } render(); toast(Core.on ? 'Live visuals on' : 'Live visuals off'); };

// ---------- Autopilot runs on Fable 5.2 unless you pick something lighter ----------
// The page names the model; if this account can't use it, the request falls back to the tier next to it without an error.
const AI = {
  MODES: [['fable', 'Fable 5.2'], ['auto', 'Balanced'], ['fast', 'Fast']], applied: '',
  mode() { const m = lsGet('aiMode'); return ['fable', 'auto', 'fast'].includes(m) ? m : 'fable'; },
  label: id => id === 'claude-fable-5-2' ? 'Fable 5.2' : '',
  // what the coach sheet shows: the model asked for, or what answered if that one wasn't available
  pill() { const want = this.MODES.find(x => x[0] === this.mode())[1]; return this.mode() !== 'fable' || !this.asked ? want : (this.label(this.applied) || 'Best available'); },
  opts(o) {
    const x = Object.assign({}, o || {}), m = this.mode();
    if (m === 'fable') { x.model = 'claude-fable-5-2'; x.modelTier = 'complex'; if (!x.effort) x.effort = 'low'; }
    else if (m === 'fast') { x.modelTier = 'quick'; delete x.effort; }
    return x;
  },
  wrap(base) {
    if (!base) return base;
    const f = (input, o) => base(input, AI.opts(o)).then(r => { AI.applied = (r && r.modelApplied) || ''; AI.asked = true; const p = $('#aiModel'); if (p) p.textContent = AI.pill(); return r; });
    f.json = (input, o) => base.json(input, AI.opts(o));
    f.limits = () => base.limits();
    return f;
  }
};
ACT.aiMode = el => { lsSet('aiMode', el.dataset.v); AI.asked = false; render(); toast({ fable: 'Autopilot will ask for Fable 5.2', auto: 'Autopilot on the balanced model', fast: 'Autopilot on the fastest model' }[AI.mode()]); };
// the coach and the planner know the ratings too
const v8Context = extraContext;
extraContext = function () { const A = PL.attrs(); return v8Context().concat(A.has ? [`Player rating: overall ${A.ovr} (${A.tier[1]}, ${PL.arch(A)}). ${A.list.map(a => `${a.name} ${a.rating}`).join(', ')}. Scale 40 to 99, from the last ${A.span} days.`, `Today's quests: ${questState().map(q => `${q.title} (${q.ok ? 'done' : 'open'})`).join('; ')}.`] : []); };
// widgets, CarPlay and native shells see the rating and the quests
const v8Snap = snapshot;
snapshot = function () { const o = v8Snap(), A = PL.attrs(); o.player = { overall: A.ovr, tier: A.tier[1], archetype: PL.arch(A), attributes: Object.fromEntries(A.list.map(a => [a.id, a.rating])) }; o.quests = questState().map(q => ({ title: q.title, done: q.ok, xp: q.xp })); return o; };

// ---------- Where it all shows up ----------
const v8Render = render;
render = function () { PL.clear(); v8Render(); Core.attach(); questCheck(); ovrCheck(); };
document.addEventListener('keydown', e => { if (e.key === 'Escape' && Cmd.isOpen() && Modal.active() === $('#cmd')) { e.preventDefault(); Cmd.close(); } });
addEventListener('resize', () => { if (S.ready && S.view === 'today') Core.attach(); });
// ================= TIMERS =================
// Every countdown and stopwatch in the app is computed from saved start and end times, so none of them drift or
// stall when the phone locks. This file keeps the screens that show clock time on the minute, and brings running
// timers back after the page reloads.

// Today's timeline and "up next", the fast, the sleep plan and the CarPlay clock repaint as each minute turns over
let tickDay = TODAY(), ptrDown = false;
addEventListener('pointerdown', () => { ptrDown = true; }, true);
addEventListener('pointerup', () => { ptrDown = false; }, true);
addEventListener('pointercancel', () => { ptrDown = false; }, true);
function minuteTick() {
  clearTimeout(minuteTick.t);
  minuteTick.t = setTimeout(() => {
    try {
      if (S.ready && !document.hidden) {
        const v = S.view, newDay = TODAY() !== tickDay;
        if (newDay) { tickDay = TODAY(); lastView = null; }
        // a finger on the screen means a swipe or hold is in progress: never swap the page out from under it
        if (newDay || (!ptrDown && (v === 'today' || (v === 'fuel' && S.core.fast) || (v === 'mind' && S.mindTab === 'sleep')))) scheduleRender();
        paintDrive();
      }
    } catch (e) {}
    minuteTick();
  }, 60000 - (Date.now() % 60000) + 40);
}
// Coming back to the app: the clock may have moved several minutes, so repaint right away and line up with the minute again
document.addEventListener('visibilitychange', () => { if (document.hidden) return; try { paintDrive(); } catch (e) {} minuteTick(); });

// After a reload, running timers pick up exactly where their clocks say they are
function resumeTimers() {
  const re = +lsGet('restEnd') || 0;
  if (re > Date.now() && S.core.active) { Workout.restEnd = re; Workout.restRun(); } else if (re) lsDel('restEnd');
  try { itResume(); } catch (e) {}
}
// ================= BOOT =================
function boot() {
  Store.loadLocal();
  const hv = (location.hash || '').slice(1);
  if (VIEWS[hv]) S.view = hv;
  S.ready = true;
  render();
  if (S.core.active) setTimeout(() => toast('Workout in progress. Open Train to resume.'), 900);
  S.bootAt = Date.now();
  Store.connect();
  setTimeout(() => Setup.maybe(), 1000);
  setTimeout(() => Setup.maybe(true), 8500);
  initAI();
  Conn.init();
  setTimeout(resumeSleep, 600);
  setTimeout(resumeTimers, 700);
  minuteTick();
  let day = TODAY();
  setInterval(() => { if (TODAY() !== day) { day = TODAY(); lastView = null; scheduleRender(); } }, 30000);
  addEventListener('hashchange', () => { const v = location.hash.slice(1); if (VIEWS[v] && v !== S.view) { S.view = v; render(); } });
  // Keep the open view honest when coming back to the tab
  document.addEventListener('visibilitychange', () => { if (!document.hidden) scheduleRender(); });
}
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot); else boot();
</script></body></html>
